name: Production publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated signed release tag (vX.Y.Z)
        required: true
        type: string
      source_run_id:
        description: Successful Release build and TestPyPI rehearsal run ID
        required: true
        type: string

concurrency:
  group: production-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-bundle:
    name: Production / verify authorized immutable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="${TAG#v}"
          test "$TAG" = "v${version}"
          ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          test "$(jq -r '.object.type' <<<"$ref_json")" = tag
          tag_object=$(jq -r '.object.sha' <<<"$ref_json")
          tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")
          jq -e '.verification.verified == true' <<<"$tag_json" >/dev/null
          commit=$(jq -r '.object.sha' <<<"$tag_json")
          test "$commit" = "$(git rev-parse origin/main)"
          git checkout --detach "$commit"
          uv run python scripts/release_policy.py version "$version"
          run_json=$(gh run view "$SOURCE_RUN_ID" --json conclusion,event,headSha,name,url)
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.event' <<<"$run_json")" = push
          test "$(jq -r '.headSha' <<<"$run_json")" = "$commit"
          test "$(jq -r '.name' <<<"$run_json")" = "Release build and TestPyPI rehearsal"
          gh run download "$SOURCE_RUN_ID" \
            --name "release-bundle-${TAG}" \
            --dir release
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          uv run python scripts/verify_release_bundle.py release
          uv run python scripts/check_artifacts.py release/python
          uvx --from check-jsonschema==0.38.0 check-jsonschema \
            --schemafile https://cyclonedx.org/schema/bom-1.6.schema.json \
            release/assets/*.cdx.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release/
          retention-days: 7
          if-no-files-found: error

  publish-pypi:
    name: Production / trusted publish to PyPI
    needs: verify-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sql-notebook-kit/${{ needs.verify-bundle.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python/
          attestations: false

  pypi-smoke:
    name: Production / install and smoke from PyPI
    needs: [verify-bundle, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-bundle.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install exact production release and smoke outside checkout
        env:
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            python -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple/ \
              "sql-notebook-kit[duckdb,viz]==${VERSION}" && break
            test "$attempt" -lt 6
            sleep 20
          done
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          python "$GITHUB_WORKSPACE/scripts/installed_smoke.py" --expected-version "$VERSION"

  github-release:
    name: Production / create GitHub Release
    needs: [verify-bundle, pypi-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-bundle.outputs.commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release
      - name: Create immutable GitHub Release while repository remains private
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          gh release create "$TAG" \
            release/python/* \
            release/assets/* \
            release/SHA256SUMS \
            --verify-tag \
            --title "SQL Notebook Kit ${VERSION} alpha" \
            --notes-file ".github/release-notes/${VERSION}.md"

  documentation:
    name: Production / versioned documentation
    needs: [verify-bundle, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-bundle.outputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen --group docs
      - name: Build and retain the exact release documentation
        env:
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          uv run --group docs mike deploy --push --update-aliases "$VERSION" latest
          mkdir pages
          git archive gh-pages | tar -x -C pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the exact release documentation URL
        env:
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          url="https://cesar-alves.github.io/sql-notebook-kit/${VERSION}/"
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location "$url" >/dev/null && exit 0
            test "$attempt" -lt 6
            sleep 10
          done
