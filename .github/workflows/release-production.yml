name: Production publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated signed release tag (vX.Y.Z)
        required: true
        type: string
      source_run_id:
        description: Successful Release build and TestPyPI rehearsal run ID
        required: true
        type: string

concurrency:
  group: production-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-bundle:
    name: Production / verify authorized immutable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          version="${TAG#v}"
          test "$TAG" = "v${version}"
          ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          test "$(jq -r '.object.type' <<<"$ref_json")" = tag
          tag_object=$(jq -r '.object.sha' <<<"$ref_json")
          tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")
          jq -e '.verification.verified == true' <<<"$tag_json" >/dev/null
          commit=$(jq -r '.object.sha' <<<"$tag_json")
          test "$commit" = "$(git rev-parse origin/main)"
          git checkout --detach "$commit"
          uv run python scripts/release_policy.py version "$version"
          run_json=$(gh run view "$SOURCE_RUN_ID" --json conclusion,event,headSha,name,url)
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.event' <<<"$run_json")" = push
          test "$(jq -r '.headSha' <<<"$run_json")" = "$commit"
          test "$(jq -r '.name' <<<"$run_json")" = "Release build and TestPyPI rehearsal"
          gh run download "$SOURCE_RUN_ID" \
            --name "release-bundle-${TAG}" \
            --dir release
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          uv run python scripts/check_artifacts.py release/python
          uvx --from check-jsonschema==0.38.0 check-jsonschema \
            --schemafile https://cyclonedx.org/schema/bom-1.6.schema.json \
            release/assets/*.cdx.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release/
          retention-days: 7
          if-no-files-found: error

  publish-pypi:
    name: Production / trusted publish to PyPI
    needs: verify-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sql-notebook-kit/${{ needs.verify-bundle.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/python/
          attestations: false

  github-release:
    name: Production / create GitHub Release
    needs: [verify-bundle, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-bundle.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-verified-${{ inputs.tag }}-${{ inputs.source_run_id }}
          path: release
      - name: Create immutable GitHub Release while repository remains private
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          gh release create "$TAG" \
            release/python/* \
            release/assets/* \
            release/SHA256SUMS \
            --verify-tag \
            --title "SQL Notebook Kit ${VERSION} alpha" \
            --notes-file ".github/release-notes/${VERSION}.md"

  documentation:
    name: Production / versioned documentation
    needs: [verify-bundle, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-bundle.outputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen --group docs
      - name: Build and retain the exact release documentation
        env:
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          uv run --group docs mike deploy --push --update-aliases "$VERSION" latest
          mkdir pages
          git archive gh-pages | tar -x -C pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the exact release documentation URL
        env:
          VERSION: ${{ needs.verify-bundle.outputs.version }}
        run: |
          url="https://cesar-alves.github.io/sql-notebook-kit/${VERSION}/"
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location "$url" >/dev/null && exit 0
            test "$attempt" -lt 6
            sleep 10
          done
