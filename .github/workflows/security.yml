name: Scheduled security depth

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: scheduled-security
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-history-security:
    name: Security / full history and dependency depth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history with Gitleaks v8.29.0
        run: >-
          docker run --rm --platform linux/amd64
          --volume "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:507de9682470025fb3e7f57fe4c4ca8263d81369e027b6538b8a252a9c0371d4
          git --no-banner --redact /repo
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - run: uv sync --frozen --all-extras
      - run: pnpm install --frozen-lockfile
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --output-file /tmp/runtime-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/runtime-requirements.txt
      - run: uvx --from semgrep==1.172.0 semgrep scan --config p/python --config p/typescript --error
      - run: pnpm audit --audit-level high
      - run: uvx --from pip-licenses==5.5.5 pip-licenses --python=.venv/bin/python --format=json --with-urls --output-file=python-licenses.json
      - run: pnpm licenses list --json > javascript-licenses.json
      - run: uv run python scripts/check_license_report.py --ecosystem pypi --report python-licenses.json
      - run: uv run python scripts/check_license_report.py --ecosystem npm --report javascript-licenses.json
      - run: uv run python scripts/license_report_to_sbom.py --ecosystem pypi --report python-licenses.json --project-version 0.1.0 --output python.cdx.json
      - run: uv run python scripts/license_report_to_sbom.py --ecosystem npm --report javascript-licenses.json --project-version 0.1.0 --output javascript.cdx.json
      - run: uvx --from check-jsonschema==0.38.0 check-jsonschema --schemafile https://cyclonedx.org/schema/bom-1.6.schema.json python.cdx.json javascript.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scheduled-security-license-reports
          path: |
            python.cdx.json
            javascript.cdx.json
          retention-days: 14
