site_name: sql-notebook-kit
site_description: Portable SQL cells, transformations, and bounded visualization
repo_url: https://github.com/cesar-alves/sql-notebook-kit
strict: true
nav:
  - Home: index.md
  - Factory contract: factory-contract.md
  - Backends: backends.md
  - Compatibility: compatibility.md
  - Migration: migration.md
  - SSO guide: sso.md
  - Lazy transformations: transformations.md
  - Visualization: visualization.md
  - Troubleshooting: troubleshooting.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
markdown_extensions:
  - admonition
  - fenced_code
  - tables
