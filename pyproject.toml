[project]
name = "sql-notebook-kit"
version = "0.1.0"
requires-python = ">=3.11"
description = "Portable SQL notebook sessions, bounded results, and editable visualizations."
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ipython>=8,<10",
    "sqlalchemy>=2.0.36,<3.0",
    "jupysql>=0.11,<0.12",
]

[project.optional-dependencies]
redshift = [
    "sqlalchemy-redshift>=1.0.0,<2.0",
    "redshift-connector>=2.1.3,<3.0",
    "sqlframe[redshift]>=4.3,<4.4",
]
viz = [
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
]
transform = [
    "pandas>=3.0.5,<4",
    "sqlframe>=4.3,<4.4",
]
duckdb = [
    "duckdb>=1.4,<2",
    "duckdb-engine>=0.17,<1",
    "pandas>=3.0.5,<4",
    "sqlframe[duckdb]>=4.3,<4.4",
]
databricks = [
    "databricks-sql-connector[pyarrow]>=3.6,<5",
    "databricks-sqlalchemy>=2,<3",
    "pandas>=3.0.5,<4",
    "sqlframe[databricks]>=4.3,<4.4",
]
bigquery = [
    "google-cloud-bigquery[pandas]>=3,<4",
    "google-cloud-bigquery-storage>=2,<3",
    "sqlalchemy-bigquery>=1.12,<2",
    "pandas>=3.0.5,<4",
    "sqlframe[bigquery]>=4.3,<4.4",
]
all = [
    "sqlalchemy-redshift>=1.0.0,<2.0",
    "redshift-connector>=2.1.3,<3.0",
    "sqlframe[redshift]>=4.3,<4.4",
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
    "duckdb>=1.4,<2",
    "duckdb-engine>=0.17,<1",
    "sqlframe[duckdb]>=4.3,<4.4",
    "databricks-sql-connector[pyarrow]>=3.6,<5",
    "databricks-sqlalchemy>=2,<3",
    "google-cloud-bigquery[pandas]>=3,<4",
    "google-cloud-bigquery-storage>=2,<3",
    "sqlalchemy-bigquery>=1.12,<2",
    "sqlframe[databricks,bigquery]>=4.3,<4.4",
]

[project.urls]
Repository = "https://github.com/cesar-alves/sql-notebook-kit"
Issues = "https://github.com/cesar-alves/sql-notebook-kit/issues"

[project.scripts]
sql-notebook-kit = "sql_notebook_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "build>=1.2",
    "twine>=6.0",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
    "duckdb>=1.4,<2",
    "duckdb-engine>=0.17,<1",
    "sqlframe[duckdb]>=4.3,<4.4",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.27,<1",
]
frontend = [
    "jupyterlab>=4,<5",
]
gui = [
    "ipykernel>=6,<8",
    "voila>=0.5,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["sql_notebook_kit"]

[tool.hatch.build.targets.wheel.shared-data]
"sql_notebook_kit/labextension" = "share/jupyter/labextensions/@sql-notebook-kit/jupyterlab"

[tool.hatch.build]
artifacts = [
    "sql_notebook_kit/vscode/sql-notebook-kit-vscode.vsix",
]
include = [
    "sql_notebook_kit/**/*.py",
    "sql_notebook_kit/**/*.css",
    "sql_notebook_kit/**/*.vsix",
    "sql_notebook_kit/labextension/**/*",
    "sql_notebook_kit/py.typed",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/**/*.md",
    "examples/*.ipynb",
    "hatch_build.py",
    "mkdocs.yml",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "frontend/**/*",
    "!frontend/**/node_modules/**/*",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["sql_notebook_kit"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
