[project]
name = "redshift-notebooks"
version = "0.1.0"
requires-python = ">=3.11"
description = "SQL-cell notebooks for Redshift: a connection-agnostic jupysql/SQLAlchemy core, plus an optional SSO adapter."
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ipython>=8,<10",
    "sqlalchemy>=2.0.36,<3.0",
    "jupysql>=0.11,<0.12",
]

[project.optional-dependencies]
redshift = [
    "sqlalchemy-redshift>=1.0.0,<2.0",
    "redshift-connector>=2.1.3,<3.0",
]
viz = [
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
]
all = [
    "sqlalchemy-redshift>=1.0.0,<2.0",
    "redshift-connector>=2.1.3,<3.0",
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
]

[project.urls]
Repository = "https://github.com/cesar-alves/redshift-notebooks"
Issues = "https://github.com/cesar-alves/redshift-notebooks/issues"

[project.scripts]
redshift-notebooks = "redshift_notebooks.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "build>=1.2",
    "twine>=6.0",
    "pandas>=3.0.5,<4",
    "plotly>=5.24,<7",
    "ipywidgets>=8,<9",
    "nbformat>=5.10,<6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.27,<1",
]
frontend = [
    "jupyterlab>=4,<5",
]
gui = [
    "voila>=0.5,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["redshift_notebooks"]

[tool.hatch.build.targets.wheel.shared-data]
"redshift_notebooks/labextension" = "share/jupyter/labextensions/@redshift-notebooks/jupyterlab"

[tool.hatch.build]
include = [
    "redshift_notebooks/**/*.py",
    "redshift_notebooks/**/*.css",
    "redshift_notebooks/**/*.vsix",
    "redshift_notebooks/labextension/**/*",
    "redshift_notebooks/py.typed",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/**/*.md",
    "examples/*.ipynb",
    "mkdocs.yml",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "frontend/**/*",
    "!frontend/**/node_modules/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["redshift_notebooks"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
